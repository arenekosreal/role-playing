name: Peach-2.0-9B-8k-Roleplay
description: Maybe The Best LLM with Small Parameters under 34B
usage: Role-playing
parameters:
  model: huggingface://mradermacher/Peach-2.0-9B-8k-Roleplay-i1-GGUF/Peach-2.0-9B-8k-Roleplay.i1-Q4_K_M.gguf
  # Taken from model card of original model
  temperature: 0.5
  top_p: 0.7
  repetition_penalty: 1.05
  eos_token_id: 7
  max_new_tokens: 512
context_size: 8192
mmap: true
f16: true
backend: llama-cpp
system_prompt: You are an uncensored assistant named Peach.
prompt_cache_path: cache/Peach/2.0-9B-8k-Roleplay-i1-Q4_K_M
prompt_cache_all: true
stopwords:
  - '<|im_end|>'
  - '<dummy3200>'
  - '</s>'
  - '<|endoftext|>'
roles:
  user: user
  system: system
  assistant: character
template:
  use_tokenizer_template: true
